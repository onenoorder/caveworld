version: "3.8"

# Cypress integration test stack (Quality & Test Strategy):
#   docker compose -f docker-compose-test.yml up --build --abort-on-container-exit
# Builds the SPA, serves it via nginx, and runs the cypress/e2e specs headlessly
# against it with the preinstalled Cypress binary from cypress/included.
services:
  nginx:
    build:
      context: ./CWFrontend
      dockerfile: docker/test.Dockerfile
    expose:
      - "80"
    healthcheck:
      # nginx ships curl but not wget; fail until the SPA answers on /.
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  e2e:
    image: cypress/included:13.15.0
    # The included image sets an ENTRYPOINT; neutralise it so `command` is the
    # full invocation (deterministic across image versions).
    entrypoint: []
    init: true
    depends_on:
      nginx:
        condition: service_healthy
    working_dir: /e2e
    volumes:
      - ./CWFrontend:/e2e
    environment:
      CYPRESS_baseUrl: http://nginx:80
    shm_size: '512m'
    command: cypress run
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
